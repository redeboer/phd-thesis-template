project:
  resources:
    - themes/rub/fonts/*.txt

book:
  description: PhD thesis, Ruhr University Bochum
  favicon: themes/rub/images/favicon.svg
  output-file: thesis-rub
  navbar:
    background: "#003560"
    collapse: false
    foreground: "#ffffff"
    logo: themes/rub/images/rub-white.svg
    right:
      - icon: download
        menu:
          - href: thesis-rub.pdf
            text: PDF
            icon: file-pdf
          - href: thesis-rub.epub
            text: ePub
            icon: tablet
          - href: thesis-paperback.pdf
            text: PDF (paperback)
            icon: file-pdf-fill
          - href: thesis-hardcover.pdf
            text: PDF (hardcover)
            icon: file-pdf-fill
  sidebar:
    logo: themes/rub/images/rub-cube.svg

rub-theme: true

thesis:
  degree: Doktors der Naturwissenschaften
  faculty: Fakultät für Physik und Astronomie
  first-examiner: Prof. Dr. First Examiner
  second-examiner: Prof. Dr. Second Examiner
  defence-date: TBA

format:
  html:
    css:
      - styles.css
      - themes/rub/styles.css
  pdf:
    include-in-header:
      - preamble/configuration.tex
      - themes/rub/configuration.tex
