name: Test bootstrap

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLICOLOR_FORCE: "1"
  COLORTERM: truecolor
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  bootstrap:
    name: Test bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - name: Test bootstrap
        run: pixi run test-bootstrap

  rub-preview:
    name: Build RUB bootstrap preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - name: Install TeX packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y texlive-lang-german texlive-latex-extra texlive-luatex
      - name: Bootstrap RUB thesis
        run: |
          pixi run bootstrap \
            --profile rub \
            --title "Example thesis" \
            --subtitle "" \
            --given-name Ada \
            --family-name Lovelace \
            --institution "Example University" \
            --department Physics \
            --city "Example City" \
            --country "Example Country" \
            --orcid "" \
            --date today \
            --repository example/thesis \
            --defence-date TBA \
            --rub-degree "Doktors der Naturwissenschaften" \
            --faculty "Fakultät für Physik und Astronomie" \
            --first-examiner "First Examiner" \
            --second-examiner "Second Examiner"
      - name: Build RUB website and documents
        run: |
          pixi run rub-fonts
          pixi run doc
      - name: Upload RUB bootstrap preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rub-bootstrap-preview
          path: docs/_build/html/
          if-no-files-found: error
          include-hidden-files: true
