name: Upgrade lock files

on:
  schedule:
    - cron: "0 6 1 1,7 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      - name: Upgrade lock files
        run: pixi run upgrade
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: maintenance/upgrade-lock-files
          commit-message: "MAINT: upgrade lock files"
          title: "MAINT: upgrade lock files"
          body: "Automated semiannual dependency and developer-tool upgrade."
