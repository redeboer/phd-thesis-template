name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
    permissions:
      pages: write
      id-token: write
    with:
      apt-packages: texlive-fonts-extra texlive-latex-extra texlive-luatex
      gh-pages: true
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
  pr-preview:
    name: PR preview
    if: >-
      github.repository == 'redeboer/phd-thesis-template' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [doc]
    permissions:
      actions: read
      contents: read
      pull-requests: write
    secrets:
      token: ${{ secrets.PAT }}
    uses: ./.github/workflows/pr-preview.yml
